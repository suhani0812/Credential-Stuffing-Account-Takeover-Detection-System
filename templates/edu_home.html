<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduPortal | Home</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        .header { background: #3c4b64; color: white; padding: 15px 5%; display: flex; justify-content: space-between; }
        .nav-bar { background: white; padding: 10px 5%; border-bottom: 1px solid #ddd; }
        .nav-bar a { margin-right: 20px; text-decoration: none; color: #444; font-weight: 500; }
        .main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; padding: 20px 5%; }
        .content-box { background: white; padding: 20px; border-radius: 4px; border: 1px solid #ddd; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-quiz { background: #6f42c1; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <span>MIT-WPU Student Portal</span>
        <a href="/logout" style="color: #ffc107; text-decoration: none;">Logout</a>
    </div>
    <div class="nav-bar">
        <a href="#">Dashboard</a>
        <a href="#" onclick="alert('Opening Gradebook...')">Grades</a>
        <a href="#" onclick="alert('Resources Loading...')">Resources</a>
    </div>
    <div class="main-grid">
        <div class="content-box">
            <h2>Current Course: DBMS</h2>
            <p>Module 4: Normalization and SQL optimization.</p>
            <hr>
            <button class="btn btn-quiz" onclick="alert('Starting Quiz: 10 mins remaining')">Start Weekly Quiz</button>
        </div>
        <div class="content-box">
            <h3>Announcements</h3>
            <p style="font-size: 0.9rem; color: #666;">Lab practicals scheduled for 20th April. Ensure your SQL scripts are ready.</p>
        </div>
    </div>
</body>
</html>
