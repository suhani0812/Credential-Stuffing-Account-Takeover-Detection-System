<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SocialConnect | Feed</title>
    <style>
        body { font-family: sans-serif; background: #fafafa; margin: 0; }
        nav { background: white; border-bottom: 1px solid #dbdbdb; padding: 10px 20%; display: flex; justify-content: space-between; position: sticky; top: 0; }
        .container { max-width: 600px; margin: 20px auto; }
        .stories { display: flex; gap: 15px; background: white; border: 1px solid #dbdbdb; padding: 15px; margin-bottom: 20px; overflow-x: auto; }
        .story-circle { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 2px; }
        .inner-circle { width: 100%; height: 100%; background: white; border-radius: 50%; border: 2px solid white; }
        .post { background: white; border: 1px solid #dbdbdb; margin-bottom: 20px; }
        .post-header { padding: 10px; font-weight: bold; }
        .post-img { width: 100%; height: 300px; background: #efefef; display: flex; align-items: center; justify-content: center; color: #8e8e8e; }
        .post-actions { padding: 10px; }
        button { background: none; border: none; font-size: 1.2rem; cursor: pointer; margin-right: 10px; }
    </style>
</head>
<body>
    <nav>
        <h2 style="font-family: 'Billabong', cursive; font-size: 1.8rem;">SocialConnect</h2>
        <div>
            <button onclick="location.reload()">🏠</button>
            <button onclick="alert('No new messages')">✉️</button>
            <a href="/logout" style="text-decoration: none; font-size: 0.9rem; font-weight: bold; color: red;">Logout</a>
        </div>
    </nav>
    <div class="container">
        <div class="stories">
            <div class="story-circle"><div class="inner-circle"></div></div>
            <div class="story-circle"><div class="inner-circle"></div></div>
            <div class="story-circle"><div class="inner-circle"></div></div>
        </div>
        <div class="post">
            <div class="post-header">suhani_2026</div>
            <div class="post-img">Image Content Placeholder</div>
            <div class="post-actions">
                <button onclick="this.innerHTML = (this.innerHTML == '❤️' ? '🤍' : '❤️')">🤍</button>
                <button onclick="alert('Comments disabled')">💬</button>
            </div>
            <div style="padding: 0 10px 10px;"><strong>1,204 likes</strong><br>Late night coding sessions...</div>
        </div>
    </div>
</body>
</html>
