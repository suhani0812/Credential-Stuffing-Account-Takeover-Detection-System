<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Revoked | Police Hub</title>
    <style>
        body {
            background: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .alert-card {
            background: #111827;
            border: 2px solid #ef4444;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
            max-width: 450px;
        }
        .icon { font-size: 50px; margin-bottom: 10px; }
        h1 { color: #ef4444; margin: 0; letter-spacing: 2px; }
        p { color: #94a3b8; line-height: 1.6; margin: 20px 0; }
        .ref-id {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }
        .btn:hover { color: #f8fafc; border-bottom: 1px solid #f8fafc; }
    </style>
</head>
<body>
    <div class="alert-card">
        <div class="icon">🚫</div>
        <h1>ACCOUNT FROZEN</h1>
        <p>Your credentials have been flagged by the <strong>Forensic Detection Engine</strong>. Access is restricted to protect network integrity.</p>
        <div style="margin: 20px 0;">
            <span style="font-size: 0.8rem; text-transform: uppercase; color: #64748b;">Case Reference</span><br>
            <span class="ref-id">POL-REF-{{ user_id }}</span>
        </div>
        <p style="font-size: 0.9rem;">Please report to the Cyber-Cell with valid identification.</p>
        <a href="/" class="btn">Return to Terminal</a>
    </div>
</body>
</html>
