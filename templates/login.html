<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gateway | Secure Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user_style.css') }}">
    <script>
        function updateAction() {
            var siteId = document.getElementById("site_select").value;
            document.getElementById("login_form").action = "/login-process/" + siteId;
        }
    </script>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div style="font-size: 3rem;">🌐</div>
        <h2>Portal Login</h2>
        <p>Select your destination site to continue.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-msg {% if category == 'success' %}msg-success{% else %}msg-danger{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form id="login_form" action="/login-process/1" method="POST" target="_blank">
            <select id="site_select" class="input-field" onchange="updateAction()" required>
                <option value="1">SocialConnect</option>
                <option value="2">Global Trust Bank</option>
                <option value="3">SwiftCart Shopping</option>
                <option value="4">EduPortal (MIT-WPU)</option>
            </select>

            <input type="email" name="u_email" placeholder="Email Address" required class="input-field">
            <input type="password" name="u_pass" placeholder="Password" required class="input-field">
            
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div style="margin-top: 15px; font-size: 0.85rem;">
            <a href="/forgot-password" style="color: #007bff; text-decoration: none;">Forgot Password?</a>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
            <span>New user? <a href="/signup" style="color: #28a745; text-decoration: none; font-weight: bold;">Create Account</a></span>
        </div>
    </div>
</body>
</html>
