<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Login | Police Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/hub_style.css') }}">
    <style>
        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            margin: 100px auto;
            border: 1px solid #334155;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--neon-red);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body style="display: block;">
    <div class="login-box">
        <h2 style="color: var(--neon-red);">POLICE TERMINAL</h2>
        <p style="color: var(--text-dim); font-size: 0.8rem;">AUTHORIZED PERSONNEL ONLY</p>
        <hr style="border: 0.5px solid #334155; margin: 20px 0;">
        
        <form action="/admin-auth" method="POST">
            <input type="text" name="badge_id" placeholder="BADGE_ID (OFFICER_007)" required>
            <input type="password" name="password" placeholder="PASSWORD" required>
            <button type="submit">INITIALIZE LOGIN</button>
        </form>
    </div>
</body>
</html>
