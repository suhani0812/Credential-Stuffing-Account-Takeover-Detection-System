<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Access | Security Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user_style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h2>🔒 Account Recovery</h2>
        <p>Update your credentials across the network.</p>
        <form action="/forgot-password" method="POST">
            <input type="email" name="u_email" placeholder="Enter Registered Email" required class="input-field">
            <input type="password" name="u_new_pass" placeholder="Enter New Password" required class="input-field">
            <button type="submit" class="btn-primary">Update Password</button>
        </form>
        <a href="/" class="back-link">Back to Login</a>
    </div>
</body>
</html>
